name: QA fixtures
# Snapshots the public catalog RPCs into the qa-fixtures branch so the app can be
# tested offline with real products. Read-only calls with the publishable key.
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump
        env:
          SB: https://oxrqkgbbccstbetxpnsn.supabase.co
          KEY: sb_publishable_ZZTqt5iEvQBsDIomZCIVQw_bvcaJ5_g
        run: |
          mkdir -p out && cd out
          call() { curl -sS "$SB/rest/v1/rpc/orders_app" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' -d "$1"; }
          call '{"action":"catalog_meta","args":{}}' > catalog_meta.json
          for o in 0 1000 2000 3000 4000; do call "{\"action\":\"products_page\",\"args\":{\"offset\":$o,\"limit\":1000}}" > products_$o.json; done
          ls -la; head -c 300 catalog_meta.json
          git init -q -b qa-fixtures && git add -A
          git -c user.name=qa -c user.email=qa@users.noreply.github.com commit -qm "fixtures $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" qa-fixtures
