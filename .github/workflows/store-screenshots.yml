name: App Store screenshots

# Renders 6.9" (1320x2868) App Store screenshots from the live site in iOS-app mode
# and commits them to ios-app/screenshots/.
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          sudo apt-get install -y fonts-noto-core fonts-noto-color-emoji >/dev/null 2>&1 || true
      - name: Render
        run: |
          rm -rf ios-app/screenshots && mkdir -p ios-app/screenshots
          NODE_PATH=/tmp/pw/node_modules node ios-app/scripts/store-screenshots.js ios-app/screenshots
      - name: Commit
        run: |
          git config user.name "ios-ci"; git config user.email "ios-ci@users.noreply.github.com"
          git add -A ios-app/screenshots
          git commit -m "App Store screenshots from live site [skip ci]" && git push || echo "no changes"
