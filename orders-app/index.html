<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تطبيق 3045</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="3045">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Playfair+Display:wght@700&family=Montserrat:wght@600&display=swap">
<style>
/* Layout: white-paper app — the 390×844 phone (framed on desktop, full screen on mobile); every surface is white, structure comes from hairline rules, navy type and the logo's red bar. Single light theme by design. */
:root{
  color-scheme:light;
  --navy:#002068; --navy-2:#00174D; --navy-ink:#0E1230; --red:#C80828; --red-2:#A50620;
  --bg:#FFFFFF; --surface:#FFFFFF; --fg:#0E1230; --muted:#6A6F80; --line:#E6E8F0; --line-2:#F0F1F5; --hair:#D8DCE8;
  --navy-tint:#F3F5FB; --red-tint:#FFF3F5; --ok:#1F8A4C; --ok-tint:#EEF8F1;
  --shadow:0 10px 30px rgba(0,32,104,.10); --shadow-sm:0 2px 8px rgba(0,32,104,.08);
  --display:'Cairo','IBM Plex Sans Arabic',system-ui,sans-serif; --body:'IBM Plex Sans Arabic',system-ui,sans-serif; --serif:'Playfair Display',Georgia,serif; --caps:'Montserrat',sans-serif;
  /* legacy aliases used by markup */
  --green:var(--navy); --green-2:var(--navy-2); --green-soft:var(--navy-tint); --green-on:#FFFFFF; --green-dot:#2ECC71;
  --amber:var(--red); --amber-soft:var(--red-tint); --amber-line:#F3C9D1; --amber-text:var(--red-2);
  --red-soft:var(--red-tint); --soft:#FFFFFF;
  --blue:var(--navy); --blue-soft:#FFFFFF; --sand:var(--navy); --sand-soft:#FFFFFF; --violet:var(--navy); --violet-soft:#FFFFFF; --teal:var(--navy); --teal-soft:#FFFFFF;
  --map:#FFFFFF; --map-road:#E9EBF2; --map-park:#F1F6F2; --map-water:#EAF1FB; --map-bldg:#F3F4F8; --map-dash:#C9CDDB;
  --frame:#0E1230;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#FFFFFF;color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;direction:rtl;text-align:right;font-variant-numeric:tabular-nums;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#FFFFFF}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:right}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;line-height:1.3;text-wrap:balance;color:var(--navy)}
a{color:var(--navy);text-decoration:none}
.money{font-family:var(--display);font-weight:800;white-space:nowrap;color:var(--navy)}

/* Phone frame */
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0;background:#FFFFFF}
.phone{position:relative;width:100%;height:100%;background:#FFFFFF;overflow:hidden;display:flex;flex-direction:column}
@media (min-width:640px) and (min-height:700px){
  .stage{padding-block:20px;background:#FFFFFF}
  .phone{width:390px;height:min(844px,100%);border-radius:44px;border:10px solid var(--frame);box-shadow:0 40px 90px rgba(14,18,48,.22)}
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#FFFFFF}
.screen[hidden]{display:none}
.hd{background:#FFFFFF;border-bottom:1px solid var(--line);padding:14px 16px 12px;display:flex;align-items:center;gap:12px;flex:none}
.hd.green{background:#FFFFFF;color:var(--fg);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;gap:14px;padding:12px 20px 14px}
.hd h1{font-size:18px;flex:1;min-width:0}
.hd .sub{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;background:#FFFFFF;border:1px solid var(--line);display:grid;place-items:center;color:var(--navy);flex:none}
.body{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 20px;display:flex;flex-direction:column;gap:16px;background:#FFFFFF}
.body.flush{padding:0}
.body>*{flex:none}
.ft{background:#FFFFFF;border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));flex:none;display:flex;flex-direction:column;gap:8px}
.cta{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#FFF;border-radius:16px;padding:14px 18px;min-height:56px;font-weight:700;font-size:15px;width:100%;box-shadow:0 8px 20px rgba(0,32,104,.22)}
.cta .money{color:#FFF}
.cta:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.ghost{display:flex;align-items:center;justify-content:center;border:1.5px solid var(--navy);background:#FFFFFF;color:var(--navy);border-radius:14px;padding:12px 16px;font-weight:700;min-height:48px;width:100%}
.link{color:var(--navy);font-weight:700;font-size:12.5px}

/* Bottom nav */
.nav{background:#FFFFFF;border-top:1px solid var(--line);padding:10px 12px calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;align-items:end;flex:none}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:10.5px;font-weight:600;padding:6px 0;min-height:44px;position:relative;text-align:center}
.nav button[aria-current="page"]{color:var(--navy)}
.nav button[aria-current="page"]:not(.chef)::after{content:"";width:18px;height:3px;border-radius:2px;background:var(--red);margin-top:2px}
.nav .chef{color:var(--red);font-weight:700;padding:0}
.nav .chef span.orb{width:58px;height:58px;margin-top:-32px;border-radius:50%;background:var(--red);border:4px solid #FFFFFF;display:grid;place-items:center;color:#FFF;box-shadow:0 8px 20px rgba(200,8,40,.35)}
.badge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#FFF;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* Home */
.brandline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandline .wordmark{font-family:var(--display);font-size:13px;color:var(--navy);font-weight:800}
.logo-sm-wrap{display:inline-flex}
.logo-sm{display:block;height:52px;width:auto}
.addr{display:flex;align-items:center;gap:8px;color:var(--fg);min-width:0}
.addr div{display:flex;flex-direction:column;gap:1px;min-width:0}
.addr small{font-size:11px;color:var(--muted)}
.addr b{font-size:14px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.open{display:flex;align-items:center;gap:6px;background:#FFFFFF;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--navy)}
.open i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px var(--ok-tint)}
.search{display:flex;align-items:center;gap:10px;background:#FFFFFF;border-radius:14px;padding:0 14px;min-height:48px;color:var(--muted);border:1.5px solid var(--hair)}
.search:focus-within{border-color:var(--navy)}
.hd.green .search{background:#FFFFFF}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:14px;color:var(--fg);padding:0;min-width:0;height:46px}
.chefcard{display:flex;align-items:center;gap:14px;background:#FFFFFF;border:1.5px solid var(--red);border-radius:22px;padding:16px;color:var(--fg);width:100%;position:relative;overflow:hidden}
.chefcard::before{content:"";position:absolute;inset-inline-start:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:var(--red-tint)}
.chefcard .orb{width:52px;height:52px;border-radius:16px;background:var(--red);display:grid;place-items:center;color:#FFF;flex:none;position:relative}
.chefcard div{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.chefcard h2{font-size:17px;color:var(--red-2)}
.chefcard p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between}
.sec-h h2{font-size:17px;position:relative;padding-bottom:6px}
.sec-h h2::after{content:"";position:absolute;inset-inline-start:0;bottom:0;width:34px;height:3px;border-radius:2px;background:var(--red)}
.cat4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.cat4 button{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--navy);font-size:11.5px;font-weight:700;text-align:center}
.cat4 button small{font-weight:500}
.cat4 .ic img,.ic img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.cat4 .ic{overflow:hidden;padding:0}
.cat4 .ic{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:30px;line-height:1;background:#FFFFFF!important;color:var(--navy)!important;border:1.5px solid var(--hair)}
.ing-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px!important}
.ing-grid .ing{flex-direction:column;align-items:stretch;border:1px solid var(--line);border-radius:14px;padding:10px;gap:6px;position:relative}
.ing-grid .ing input{position:absolute;top:10px;inset-inline-start:10px}
.ing-grid .ing .tile{width:100%;height:64px;font-size:30px}
.ing-grid .ing .mid{text-align:center;align-items:center}
.ing-grid .ing .money{text-align:center}
.cline-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 14px!important}
.cline-grid .cline{flex-direction:column;align-items:stretch;border:1px solid var(--line);border-radius:14px;padding:10px;gap:6px;text-align:center}
.cline-grid .cline .tile{width:100%;height:92px;font-size:28px;border-radius:12px}
.cline-grid .cline .mid{align-items:center}
.cline-grid .cline .step{align-self:center}
.cline-grid .cline .money{text-align:center;min-width:0}
.ocard-grid .ocard{padding:10px;gap:6px;font-size:12px}
.vt{display:inline-flex;border:1.5px solid var(--hair);border-radius:12px;padding:2px;gap:2px;background:#FFF}
.vt button{width:34px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.vt button[aria-pressed="true"]{background:var(--navy);color:#FFF}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcard{background:#FFFFFF;border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow-sm)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block;background:#FFF}
.tile{overflow:hidden;position:relative}
.pcard .tile{height:108px;border-radius:14px;display:grid;place-items:center;font-size:46px;line-height:1;position:relative;background:#FFFFFF!important;border:1px solid var(--line-2)}
.pcard .nm{font-size:13px;font-weight:700;line-height:1.4;min-height:2.8em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--fg)}
.pcard .u{font-size:11.5px;color:var(--muted)}
.pcard .row{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.pcard .step{padding:2px}.pcard .step button{width:26px;height:26px;font-size:16px}.pcard .step span{min-width:16px;font-size:12.5px}
.pcard .money{font-size:15px}
.plus{width:36px;height:36px;border-radius:12px;background:var(--navy);color:#FFF;font-size:22px;line-height:1;display:grid;place-items:center;flex:none;text-align:center}
.low{position:absolute;top:6px;inset-inline-start:6px;font-size:10px;background:#FFFFFF;border:1px solid var(--red);color:var(--red);padding:2px 6px;border-radius:6px;font-weight:700}
.step{display:inline-flex;align-items:center;gap:2px;background:var(--navy);color:#FFF;border-radius:12px;padding:3px}
.step button{width:30px;height:30px;border-radius:9px;color:inherit;font-size:18px;display:grid;place-items:center;text-align:center}
.step span{min-width:18px;text-align:center;font-size:13px;font-weight:700}
.step.lite{background:#FFFFFF;border:1.5px solid var(--navy);color:var(--navy);padding:2px}
.step.lite button{width:28px;height:28px;font-size:16px}

/* Chips / list rows */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--hair);background:#FFFFFF;color:var(--navy);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;min-height:36px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);color:#FFF;border-color:var(--navy)}
.prow{background:#FFFFFF;border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px}
.prow .tile{width:72px;height:72px;border-radius:16px;display:grid;place-items:center;font-size:34px;line-height:1;flex:none;position:relative;background:#FFFFFF!important;border:1px solid var(--line-2)}
.prow .mid{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.prow .nm{font-size:13.5px;font-weight:700;line-height:1.4}
.prow .u{font-size:11.5px;color:var(--muted)}
.prow .money{font-size:15px;margin-top:2px}
.plus.lg{width:40px;height:40px;font-size:24px}
.list{display:flex;flex-direction:column;gap:10px}
.more{align-self:center;color:var(--navy);font-weight:700;font-size:13px;padding:10px 18px;border:1.5px solid var(--navy);border-radius:999px}
.empty{padding:36px 12px;text-align:center;color:var(--muted);font-size:13.5px}
.empty h3{color:var(--navy);font-size:17px;margin-bottom:6px}
.skel{background:var(--line-2);border-radius:12px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Cards / forms */
.card{background:#FFFFFF;border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card .t{font-size:13.5px;font-weight:800;color:var(--navy);font-family:var(--display)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--navy)}
.field input,.field textarea,.field select{border:1.5px solid var(--hair);background:#FFFFFF;border-radius:14px;padding:12px 14px;width:100%;min-height:48px}
.field input:focus,.field textarea:focus{border-color:var(--navy)}
.field textarea{min-height:72px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.alert{border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.6;display:flex;gap:8px;align-items:flex-start;background:#FFFFFF;border:1px solid var(--line)}
.alert.amber{border-color:var(--red);color:var(--red-2)}
.alert.red{border-color:var(--red);color:var(--red)}
.alert.green{border-color:var(--navy);color:var(--navy)}
.sum{display:flex;justify-content:space-between;font-size:13px}
.sum span:first-child{color:var(--muted)}
.sum.total{font-family:var(--display);font-weight:800;font-size:16px;color:var(--navy)}.sum.total span:first-child{color:var(--navy)}
.hr{height:1px;background:var(--line)}
.opt2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{border:1.5px solid var(--hair);background:#FFFFFF;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-height:56px;color:var(--fg)}
.opt b{font-size:13px;font-weight:700}.opt small{font-size:11px;color:var(--muted)}
.opt[aria-pressed="true"]{border:2px solid var(--navy);color:var(--navy)}
.opt[aria-pressed="true"] small{color:var(--red);font-weight:700}
.radio{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:13px}
.radio input{width:18px;height:18px;accent-color:var(--navy);margin:0}
.radio span{flex:1}.radio small{color:var(--muted);font-size:11px}
.cline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.cline:last-child{border-bottom:0}
.cline .tile{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex:none;background:#FFFFFF!important;border:1px solid var(--line-2)}
.cline .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cline .nm{font-size:13px;font-weight:600}
.cline .u{font-size:11px;color:var(--muted)}
.cline .money{font-size:13px;min-width:52px;text-align:left}
.grouph{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#FFFFFF;border-bottom:1px solid var(--line)}
.grouph .orb{width:28px;height:28px;border-radius:50%;background:var(--red);color:#FFF;display:grid;place-items:center;flex:none}
.grouph div{flex:1;display:flex;flex-direction:column;gap:1px}
.grouph b{font-size:13.5px;font-weight:700;color:var(--navy)}.grouph small{font-size:11px;color:var(--red-2)}

/* Chat (chef) */
.bub{max-width:300px;background:#FFFFFF;border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:13.5px;line-height:1.6;align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--navy);color:#FFF;border:0;border-radius:18px 18px 4px 18px;max-width:280px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start}
.sugg button{border:1.5px solid var(--red);background:#FFFFFF;color:var(--red-2);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;min-height:40px}
.ing{display:flex;align-items:center;gap:10px;min-height:44px}
.ing input{width:20px;height:20px;accent-color:var(--navy);margin:0;flex:none}
.ing .tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:#FFFFFF!important;border:1px solid var(--line-2)}
.ing .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ing .nm{font-size:13px;font-weight:700}
.ing .u{font-size:11.5px;color:var(--muted)}
.ing .money{font-size:13.5px}
.ing .qcol{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.ing .step.lite button{width:26px;height:26px;font-size:15px}.ing .step.lite span{min-width:16px;font-size:12.5px}
.ing-grid .ing .qcol{align-items:center;width:100%}
.ing.off{opacity:.45}.ing.off .nm{text-decoration:line-through}
.ing .alt{font-size:11px;color:var(--red);font-weight:700;padding:4px 0}
.chatform{display:flex;align-items:center;gap:10px}
.chatform label{flex:1;display:flex;align-items:center;background:#FFFFFF;border:1.5px solid var(--hair);border-radius:14px;padding:0 14px;min-height:48px}
.chatform label:focus-within{border-color:var(--navy)}
.chatform input{flex:1;border:0;outline:0;background:transparent;font-size:14px;color:var(--fg);padding:0;min-width:0}
.chatform button{width:48px;height:48px;border-radius:14px;background:var(--red);color:#FFF;display:grid;place-items:center;flex:none}
.servings{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:4px;background:#FFFFFF}
.servings button{width:34px;height:34px;border-radius:9px;background:#FFFFFF;border:1px solid var(--line);color:var(--navy);font-size:18px;display:grid;place-items:center;text-align:center}
.servings span{min-width:62px;text-align:center;font-size:12.5px;font-weight:700}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

/* Auth */
.auth{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px 24px 16px;color:var(--fg);background:#FFFFFF;text-align:center}
.auth .logo{width:260px;max-width:100%;display:grid;place-items:center;background:#FFFFFF}
.auth .logo img{width:100%;height:auto;display:block}
.morse{display:flex;gap:7px;align-items:center;justify-content:center}
.morse span{display:flex;gap:2px}
.morse i{display:block;height:3px;border-radius:2px;background:var(--navy);opacity:.6}
.morse .d{width:3px}.morse .h{width:9px}
.auth h1{font-size:24px;color:var(--navy)}

async function rpc(action,args){

function applyCatalog(d){
  // categories with nothing to show (no visible product in them or their sub-categories) are dropped
  const n=new Map();for(const p of d.prods){n.set(p.cat,(n.get(p.cat)||0)+1)}
  const subCnt=c=>n.get(c.id)||0;
  S.cats=d.cats.filter(c=>c.parent?subCnt(c)>0:(subCnt(c)>0||d.cats.some(s=>s.parent===c.id&&subCnt(s)>0)));
  S.catById=new Map(S.cats.map(c=>[c.id,c]));
  if(d.settings)S.settings={...DEFAULTS,...d.settings};
  S.prods=d.prods.map(p=>({...p,n:norm(p.name)}));
  S.byId=new Map(S.prods.map(p=>[p.id,p]));
  for(const p of S.prods){if(!p.emoji||p.emoji==='📦'){const c=S.catById.get(p.cat);if(c&&c.emoji)p.emoji=c.emoji}}
  for(const id of Object.keys(S.cart)){if(!S.byId.has(id))delete S.cart[id]}
  S.top=(d.top||[]).map(id=>S.byId.get(id)).filter(Boolean);
  S.hasThumb=!!d.thumb;S.catImg=d.catimg||{};
  S.ready=true;
}
async function loadCatalog(force){
  if(S.loading)return;
  const cached=ls.get('smo_catalog7',null);
  if(!force&&cached&&Date.now()-cached.ts<60*60*1000&&cached.prods&&cached.prods.length){applyCatalog(cached);render();return}
  S.loading=true;setConn('جارٍ تحميل المنتجات من المتجر…');render();
  try{
    const d=await rpc('catalog_meta');
    if(!d||!d.cats)throw{code:'tool_error',message:'شكل النتيجة غير متوقع'};
    const cats=(d.cats||[]).map(a=>({id:a[0],name:a[1],emoji:a[2]||'📦',parent:a[3],sort:a[4],img:a[5]||null}));
    const rows=[];let last='';
    for(let i=0;i<12;i++){
      setConn(`جارٍ تحميل المنتجات… ${rows.length}`);
      const arr=await rpc('products_page',{after:last});
      rows.push(...(Array.isArray(arr)?arr:[]));
      if(arr.length<1000)break;last=arr[arr.length-1][0];
    }
    const prods=rows.map(a=>({id:a[0],name:a[1],price:Number(a[2]),stock:Number(a[3]),emoji:a[4]||'📦',cat:a[5],unit:a[6],bulk:!!a[7],sm:a[8]||null}));
    prods.sort((x,y)=>x.name.localeCompare(y.name,'ar'));
    const data={ts:Date.now(),cats,prods,settings:(d.settings&&typeof d.settings==='object')?d.settings:null,top:d.top||[],thumb:!!d.thumb,catimg:d.catimg||{}};
    ls.set('smo_catalog7',data);applyCatalog(data);setConn('');
  }catch(e){S.loadError=errText(e);setConn('')}
  finally{S.loading=false;render()}
}

const LOCAL_IMG=new Map(); // product id → version, for pictures mirrored into img/ on this site (img/manifest.json): served from the site's own CDN
function imgSrc(p){const v=LOCAL_IMG.get(p.id);if(v)return 'img/'+encodeURIComponent(p.id)+'.jpg?v='+encodeURIComponent(v);if(p.sm)return IMG_BASE+p.sm;return S.img.get(p.id)||null}
async function loadLocalImages(){try{const r=await fetch('img/manifest.json',{cache:'no-cache'});if(!r.ok)return;const m=await r.json();if(m&&typeof m==='object'&&!Array.isArray(m)){Object.entries(m).forEach(([id,v])=>LOCAL_IMG.set(id,String(v).replace(/[^\w.-]/g,'').slice(-24)));if(LOCAL_IMG.size)render()}}catch{}}
function tileHTML(p,cls,extra){const im=imgSrc(p);return `<div class="tile ${cls||''}" ${im?'':`data-pid="${esc(p.id)}"`}>${im?`<img src="${im}" alt="" loading="lazy" decoding="async">`:esc(p.emoji)}${extra||''}</div>`}
/* thumbs persist in IndexedDB so the second visit is instant; the first visit fetches only what is near the viewport, small tiles first */
const IDB={db:null,open(){if(this.db)return Promise.resolve(this.db);return new Promise(res=>{try{const r=indexedDB.open('smo_thumbs',1);r.onupgradeneeded=()=>r.result.createObjectStore('t');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>res(null)}catch{res(null)}})},
  async getMany(ids){const db=await this.open();if(!db)return new Map();return new Promise(res=>{const out=new Map();try{const st=db.transaction('t','readonly').objectStore('t');let n=ids.length;if(!n)return res(out);ids.forEach(id=>{const q=st.get(id);q.onsuccess=()=>{if(q.result)out.set(id,q.result);if(--n===0)res(out)};q.onerror=()=>{if(--n===0)res(out)}})}catch{res(out)}})},
  async putMany(pairs){const db=await this.open();if(!db)return;try{const st=db.transaction('t','readwrite').objectStore('t');pairs.forEach(([k,v])=>st.put(v,k))}catch{}}};
function paintImages(){
  document.querySelectorAll('[data-pid]').forEach(el=>{const im=S.img.get(el.dataset.pid);if(im&&!el.querySelector('img')){const ex=el.querySelector('.low');el.innerHTML=`<img src="${im}" alt="" loading="lazy">`+(ex?ex.outerHTML:'')}});
}
async function ensureImages(ids){
  let want=[...new Set(ids)].filter(id=>!S.img.has(id)&&!S.imgPending.has(id));if(!want.length)return;
  want.forEach(id=>S.imgPending.add(id));
  const cached=await IDB.getMany(want);cached.forEach((v,k)=>{S.img.set(k,v);S.imgPending.delete(k)});
  want=want.filter(id=>!cached.has(id));
  if(cached.size)paintImages();
  if(!want.length)return;
  for(let i=0;i<want.length;i+=40){const chunk=want.slice(i,i+40);
    try{const rows=await rpc('images',{ids:chunk});
      const got=new Map((Array.isArray(rows)?rows:[]).map(r=>[r.id,r.im]));const keep=[];
      chunk.forEach(id=>{const v=got.get(id);const ok=v&&String(v).startsWith('data:');S.img.set(id,ok?v:null);if(ok)keep.push([id,v]);S.imgPending.delete(id)});
      if(keep.length)IDB.putMany(keep);
      paintImages();
    }catch(e){chunk.forEach(id=>S.imgPending.delete(id));break}
  }
}
/* viewport-driven: tiles report in as they come within 400px of view; nearby ones are fetched first, in small batches */
let _io=null,_ioQ=new Set(),_ioT=null;
function flushImageQueue(){_ioT=null;const ids=[..._ioQ];_ioQ.clear();if(ids.length)ensureImages(ids)}
function queueImages(){
  if(_io)_io.disconnect();
  const els=[...document.querySelectorAll('[data-pid]')];if(!els.length)return;
  const seen=new Set();const want=els.filter(el=>{const id=el.dataset.pid;if(seen.has(id)||S.img.has(id))return false;seen.add(id);return true});
  if(!want.length){paintImages();return}
  if(!('IntersectionObserver' in window)){ensureImages(want.map(e=>e.dataset.pid));return}
  _io=new IntersectionObserver(entries=>{let hit=false;entries.forEach(en=>{if(en.isIntersecting){_ioQ.add(en.target.dataset.pid);_io.unobserve(en.target);hit=true}});if(hit&&!_ioT)_ioT=setTimeout(flushImageQueue,60)},{root:null,rootMargin:'400px 0px',threshold:0});
  want.forEach(el=>_io.observe(el));
  paintImages();
}

const STORE_LL=()=>({lat:Number(S.settings.store_lat||32.546806),lng:Number(S.settings.store_lng||35.851194)});
function parseLatLng(txt){const t=String(txt||'').trim();if(!t)return null;
  const dms=t.match(/(\d{1,2})°\s*(\d{1,2})['′]\s*([\d.]+)["″]\s*([NS])\s*,?\s*(\d{1,3})°\s*(\d{1,2})['′]\s*([\d.]+)["″]\s*([EW])/i);
  if(dms){const lat=(+dms[1]+dms[2]/60+dms[3]/3600)*(/s/i.test(dms[4])?-1:1),lng=(+dms[5]+dms[6]/60+dms[7]/3600)*(/w/i.test(dms[8])?-1:1);return{lat:+lat.toFixed(6),lng:+lng.toFixed(6)}}
  const pats=[/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/,/[?&]q=(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/,/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/,/[?&](?:ll|center|destination|query)=(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/,/^\s*(-?\d{1,2}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)\s*$/];
  for(const re of pats){const m=t.match(re);if(m){const lat=+m[1],lng=+m[2];if(Math.abs(lat)<=90&&Math.abs(lng)<=180)return{lat,lng}}}
  return null}
function kmBetween(a,b){const R=6371,d=Math.PI/180;const dLat=(b.lat-a.lat)*d,dLng=(b.lng-a.lng)*d;const h=Math.sin(dLat/2)**2+Math.cos(a.lat*d)*Math.cos(b.lat*d)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

/* map picker: Google Maps when settings.gmaps_key is set, otherwise Leaflet + OpenStreetMap (no key needed) */
function loadOnce(id,make){return new Promise((res,rej)=>{if(document.getElementById(id))return res();const el=make();el.id=id;el.onload=()=>res();el.onerror=()=>rej(new Error('load '+id));document.head.appendChild(el)})}
function setPick(ll,src){S.pickLL={lat:+(+ll.lat).toFixed(6),lng:+(+ll.lng).toFixed(6)};const inp=$('#gmapIn');if(inp)inp.value=S.pickLL.lat+', '+S.pickLL.lng;const st=$('#gmapStatus');if(st){const km=kmBetween(S.pickLL,STORE_LL());st.innerHTML=km>12?`<div class="alert red">${ICON.info}<span>هذا الموقع يبعد ${km.toFixed(0)} كم عن المتجر، خارج نطاق التوصيل.</span></div>`:`<div class="alert green">${ICON.info}<span>الموقع محدّد · يبعد ${km.toFixed(1)} كم عن المتجر · <a href="${gmapsView(S.pickLL)}" target="_blank" rel="noopener"><b>عرض على خرائط Google</b></a></span></div>`}
  if(src!=='map'&&S.pickMap){if(S.pickMap.kind==='g'){S.pickMap.marker.setPosition(S.pickLL);S.pickMap.map.panTo(S.pickLL)}else{S.pickMap.marker.setLatLng(S.pickLL);S.pickMap.map.panTo(S.pickLL)}}}
async function mountPicker(){const el=$('#pickMap');if(!el||el.dataset.ready)return;el.dataset.ready='1';
  const a=(S.customer&&S.customer.address)||{};const start=S.pickLL||addrLL(a)||STORE_LL();const key=S.settings&&S.settings.gmaps_key;
  try{
    if(key){
      await loadOnce('gmapsjs',()=>{const sc=document.createElement('script');sc.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&language=ar&region=JO&loading=async';sc.async=true;return sc});
      await new Promise(r=>{const t=()=>window.google&&google.maps&&google.maps.Map?r():setTimeout(t,50);t()});
      const map=new google.maps.Map(el,{center:start,zoom:16,disableDefaultUI:true,zoomControl:true,gestureHandling:'greedy',clickableIcons:false});
      const marker=new google.maps.Marker({position:start,map,draggable:true,title:'باب بيتك'});
      marker.addListener('dragend',()=>{const p=marker.getPosition();setPick({lat:p.lat(),lng:p.lng()},'map')});
      map.addListener('click',e=>{marker.setPosition(e.latLng);setPick({lat:e.latLng.lat(),lng:e.latLng.lng()},'map')});
      new google.maps.Marker({position:STORE_LL(),map,title:'3045',icon:{path:google.maps.SymbolPath.CIRCLE,scale:7,fillColor:'#C80828',fillOpacity:1,strokeColor:'#FFF',strokeWeight:2}});
      S.pickMap={kind:'g',map,marker};
    }else{
      await loadOnce('leafletcss',()=>{const l=document.createElement('link');l.rel='stylesheet';l.href='vendor/leaflet/leaflet.css';return l});
      await loadOnce('leafletjs',()=>{const sc=document.createElement('script');sc.src='vendor/leaflet/leaflet.js';return sc});
      const map=L.map(el,{zoomControl:true,attributionControl:true}).setView([start.lat,start.lng],16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
      L.circleMarker([STORE_LL().lat,STORE_LL().lng],{radius:7,color:'#FFF',weight:2,fillColor:'#C80828',fillOpacity:1}).addTo(map).bindTooltip('3045');
      const marker=L.marker([start.lat,start.lng],{draggable:true,title:'باب بيتك'}).addTo(map);
      marker.on('dragend',()=>{const p=marker.getLatLng();setPick({lat:p.lat,lng:p.lng},'map')});
      map.on('click',e=>{marker.setLatLng(e.latlng);setPick({lat:e.latlng.lat,lng:e.latlng.lng},'map')});
      S.pickMap={kind:'l',map,marker};setTimeout(()=>map.invalidateSize(),200);
    }
  }catch(e){el.innerHTML=`<div class="alert amber" style="margin:16px">${ICON.info}<span>تعذّر تحميل الخريطة. استخدم «موقعي الحالي» أو الصق رابط خرائط Google.</span></div>`}
}
function useMyLocation(){if(!navigator.geolocation){toast('المتصفح لا يدعم تحديد الموقع');return}toast('جارٍ تحديد موقعك…');
  navigator.geolocation.getCurrentPosition(pos=>{setPick({lat:pos.coords.latitude,lng:pos.coords.longitude});toast('تم تحديد موقعك')},err=>{toast(err.code===1?'اسمح للمتصفح بالوصول إلى الموقع ثم أعد المحاولة':'تعذّر تحديد الموقع')},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}

V.category=()=>{const par=S.catById&&S.catById.get(S.catParent);const sub=S.catById&&S.catById.get(S.catSub);const subs=S.catParent?S.cats.filter(c=>c.parent===S.catParent):[];const list=filtered();

V.chef=()=>{const ch=S.chef;const msgs=ch.msgs.map(m=>m.role==='me'?`<div class="bub me">${esc(m.text)}</div>`:m.typing?`<div class="bub"><span class="typing"><i></i><i></i><i></i></span></div>`:`<div class="bub">${esc(m.text)}</div>`).join('');
  let result='';

  ${msgs}${result}${!S.ready?`<div class="alert amber">${ICON.info}<span>يحتاج المساعد إلى تحميل منتجات المتجر أولاً.</span></div>`:''}</div>
  <form class="ft chatform" id="chefForm" style="flex-direction:row"><label><input id="chefIn" placeholder="اكتب احتياجك: طبخة، ضيافة، تنظيف…" aria-label="اكتب احتياجك"></label><button type="submit" aria-label="إرسال">${ICON.send}</button></form>`+navHTML('chef')};
function matchCatalog(terms,exclude){
  const out=[];const ex=new Set(exclude||[]);
  for(const t of (terms||[])){const nt=norm(t);if(!nt)continue;
    for(const p of S.prods){if(ex.has(p.id)||p.bulk)continue;if(p.n.includes(nt)){const starts=p.n.startsWith(nt)?2:0;out.push({p,score:starts+1+Math.min(p.stock,50)/100-p.price/100});ex.add(p.id)}}
  }
  out.sort((a,b)=>b.score-a.score);return out.slice(0,5).map(o=>o.p);
}
async function chefAsk(text){
  const ch=S.chef;ch.msgs.push({role:'me',text});ch.msgs.push({role:'ai',typing:true});ch.result=null;ch.off={};ch.pick={};ch.qty={};ch.manual={};
  const m=text.match(/(\d+)/);if(m){const n=parseInt(m[1],10);if(n>=1&&n<=30)ch.servings=n}
  render();scrollBody();
  let r=null;
  if(S.sample){try{
    r=await askAssistant(`أنت مساعد تسوّق في سوبرماركت أردني (3045 في إربد). المستخدم كتب احتياجه: «${text}». قد يكون طبخة، أو ضيافة/عزومة، أو تنظيف البيت، أو مستلزمات رضيع/أطفال، أو فطور، أو رحلة، أو مرض/زكام، أو سهرة، أو عودة للمدارس، أو أي احتياج يومي آخر. أعد JSON فقط بالشكل:
{"dish":"عنوان القائمة بالعربية","intro":"جملة ترحيب قصيرة","perPerson":true,"items":[{"name":"اسم الصنف","qty":"الكمية لـ ${ch.servings} أشخاص مثل: 2 كغم أو عبوة واحدة","pieces":1,"search":["كلمة","كلمة بديلة"],"optional":false}]}
قواعد: perPerson = true فقط إذا كانت الكميات تتغير بعدد الأشخاص (طعام، ضيافة)، و false للاحتياجات الثابتة (تنظيف، أدوات). pieces = عدد العبوات/القطع التي تُشترى من المتجر (عدد صحيح ≥1)؛ 6 إلى 12 صنفاً؛ أسماء بضائع تُباع في سوبرماركت؛ search كلمات عربية قصيرة بلا تشكيل تطابق أسماء المنتجات الشائعة في الأردن (مثل: "أرز بسمتي"، "جميد"، "كلوركس"، "حفاضات"). إن لم يكن النص احتياجاً يمكن تلبيته من سوبرماركت أعد {"dish":"","intro":"سبب","items":[]}.`);
  }catch(e){r=null;if(e&&e.code==='no_key')S.sample=null}}
  if(!r||!Array.isArray(r.items)){const fb=FALLBACK_RECIPES.find(x=>x.keys.some(k=>text.includes(k)));if(fb)r={dish:fb.dish,intro:fb.intro,perPerson:fb.perPerson!==false,items:fb.items}}
  ch.msgs.pop();
  if(!r||!r.dish||!r.items.length){ch.msgs.push({role:'ai',text:(r&&r.intro)||'لم أفهم الاحتياج. جرّب: مقلوبة، ضيافة لـ 6، تنظيف البيت، فطور عائلي، أو مستلزمات رضيع.'});render();scrollBody();return}
  const used=[];
  r.items=r.items.slice(0,14).map(it=>{const cands=matchCatalog([].concat(it.search||[],[it.name]),used);if(cands[0])used.push(cands[0].id);return{name:it.name,qty:it.qty,pieces:Math.max(1,Math.round(Number(it.pieces)||1)),optional:!!it.optional,cands}});
  ch.baseServings=ch.servings;r.items.forEach((it,i)=>{ch.qty[i]=it.pieces});
  ch.msgs.push({role:'ai',text:r.intro||'هذه المكوّنات من رفوف المتجر:'});ch.result=r;render();scrollBody();
}
async function askAssistant(prompt){
  const r=await fetch(SB_URL+'/functions/v1/assistant',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},body:JSON.stringify({prompt})});
  const j=await r.json().catch(()=>null);
  if(!r.ok||!j){throw{code:(j&&j.error)||'server_unavailable',message:(j&&j.message)||('HTTP '+r.status)}}

}
function scaleQtyText(txt,f){return String(txt||'').replace(/(\d+(?:[.,]\d+)?)/,m=>{const v=parseFloat(m.replace(',','.'))*f;return (Math.round(v*10)/10).toString()})}
function applyServings(){const ch=S.chef;if(!ch.result)return;const f=ch.servings/(ch.baseServings||ch.servings);ch.result.items.forEach((it,i)=>{if(ch.manual[i])return;const p=(it.cands||[])[ch.pick[i]||0];const max=p?p.stock:99;ch.qty[i]=Math.max(1,Math.min(max,Math.round((it.pieces||1)*f)))})}

function genOrderNo(){const d=new Date();const yy=String(d.getFullYear()).slice(2),mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];return `ON-${yy}${mm}${dd}-${s}`}
async function placeOrder(){
  if(S.busy)return;const c=S.customer;
  if(!c||!c.name||!c.phone){S.afterAuth='cart';go('welcome');return}
  if(!c.address||!c.address.area){S.afterAuth='cart';go('address');return}
  const t=totals();const lines=cartLines();if(!lines.length)return;
  const notesEl=$('#notesIn');S.notes=notesEl?notesEl.value.trim():'';
  const payL={cash:'كاش عند الاستلام',cliq:'CliQ',card:'بطاقة عند الاستلام'}[S.pay];
  const when=S.delivery==='later'&&S.schedule?`جدولة: ${S.schedule}`:'التوصيل الآن';
  const dishes=[...new Set(lines.map(l=>l.meta&&l.meta.dish).filter(Boolean))];
  const notes=[`الدفع: ${payL}`,when,dishes.length?`قائمة الشيف: ${dishes.join('، ')}`:'',S.notes].filter(Boolean).join(' · ');
  const items=lines.map(l=>({id:l.p.id,name:l.p.name,price:Number(fmt(l.p.price)),qty:l.q,line:Number(fmt(l.p.price*l.q)),dish:(l.meta&&l.meta.dish)||undefined}));
  const addr=[c.address.area,c.address.street,c.address.landmark?'قرب '+c.address.landmark:''].filter(Boolean).join('، ');
  const order_no=genOrderNo();S.busy=true;render();
  try{
    const r=await rpc('place_order',{order_no,customer_name:c.name,customer_phone:c.phone,customer_address:addr,lat:c.address.lat?Number(c.address.lat):null,lng:c.address.lng?Number(c.address.lng):null,notes,items,subtotal:Number(fmt(t.sub)),delivery_fee:Number(fmt(t.fee)),total:Number(fmt(t.total))});
    const row=(r&&r.order_no)?r:{order_no};
    S.mine=[row.order_no,...S.mine.filter(x=>x!==row.order_no)].slice(0,30);ls.set('smo_orders',S.mine);
    S.cart={};S.cartMeta={};S.notes='';ls.set('smo_cart',{});ls.set('smo_cartmeta',{});
    S.track={id:row.id,order_no:row.order_no,status:'pending',total:t.total,items,created_at:row.created_at||new Date().toISOString(),customer_address:addr,customer_notes:notes};
    S.busy=false;S.stack=[];go('track',{order_no:row.order_no},true);toast('تم استلام طلبك');
  }catch(e){
    S.busy=false;render();const code=e&&e.code;const amb=code==='server_unavailable'||code==='upstream_error'||code==='cancelled';
    const el=$('#orderErr');if(el)el.innerHTML=`<div class="alert red">${ICON.info}<span>${esc(errText(e))}${amb?' قد يكون الطلب وصل رغم الخطأ؛ تحقق من «حسابي» برقم '+esc(order_no)+' قبل إعادة الإرسال.':''}</span></div>`;
    if(amb){S.mine=[order_no,...S.mine].slice(0,30);ls.set('smo_orders',S.mine)}
  }
}

  let d=progress*len,rx=320,ry=70;for(let i=0;i<segs.length;i++){if(d<=segs[i]){const t=d/segs[i];rx=route[i][0]+(route[i+1][0]-route[i][0])*t;ry=route[i][1]+(route[i+1][1]-route[i][1])*t;break}d-=segs[i];rx=route[i+1][0];ry=route[i+1][1]}
  return `<svg viewBox="0 0 390 380" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="390" height="380" fill="var(--map)"/><rect x="20" y="40" width="110" height="80" rx="10" fill="var(--map-park)"/><rect x="230" y="250" width="150" height="110" rx="10" fill="var(--map-park)"/><path d="M-20 330 Q60 310 140 335 T330 330 T420 340" fill="none" stroke="var(--map-water)" stroke-width="12"/>

  <g fill="var(--map-bldg)"><rect x="215" y="195" width="34" height="30" rx="3"/><rect x="330" y="90" width="44" height="34" rx="3"/><rect x="90" y="200" width="40" height="30" rx="3"/><rect x="150" y="90" width="40" height="30" rx="3"/><rect x="230" y="90" width="34" height="34" rx="3"/><rect x="30" y="140" width="40" height="28" rx="3"/></g>

  <path d="M320 70 V180 H200 V300 H80" fill="none" stroke="var(--map-dash)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>${withRider?`<path d="M320 70 V180 H200 V300 H80" pathLength="1" fill="none" stroke="var(--green)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${progress.toFixed(3)} 1"/>`:''}
  <g transform="translate(320 70)"><circle r="15" fill="var(--green)" stroke="var(--surface)" stroke-width="3"/><text x="0" y="4" text-anchor="middle" font-family="Cairo, sans-serif" font-weight="800" font-size="9" fill="#FFF">3045</text></g>
  <g transform="translate(80 300)"><path d="M0 -30 c-8 0 -14 6 -14 13 c0 9 14 22 14 22 s14 -13 14 -22 c0 -7 -6 -13 -14 -13z" fill="var(--red)" stroke="var(--surface)" stroke-width="2"/><circle r="4" cy="-18" fill="#FFF"/></g>
  ${withRider?`<g transform="translate(${rx.toFixed(1)} ${ry.toFixed(1)})"><circle r="26" fill="var(--amber)" opacity="0.18"/><circle r="15" fill="var(--amber)" stroke="var(--surface)" stroke-width="3"/><g transform="translate(-8 -8)" fill="none" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="12" r="2.2"/><circle cx="12.5" cy="12" r="2.2"/><path d="M6 12h4.5l2-4.5h-3.5L7.5 10H6z"/><path d="M8.5 4.5h2.5l1.5 3"/></g></g>`:''}</svg>`;

    ${o.customer_notes?`<div class="line-ic note"><span class="ic">📝</span><span class="tx">${esc(o.customer_notes)}</span></div>`:''}
    ${itemsHtml}
    <div class="sum total"><span>الإجمالي</span><span>${fmt(o.total)} د.أ</span></div>
    <div class="actions">
      ${next?`<button class="cta sm" data-st="${next}" data-oid="${esc(o.id)}"><span>${esc(STATUS[next])}</span><span>←</span></button>`:''}
      <div class="drv"><span class="ic">🛵</span><input id="drv-${esc(o.id)}" placeholder="اسم المندوب" value="${esc(o.assigned_driver||'')}"><button data-drv="${esc(o.id)}">حفظ</button></div>
      ${st!=='cancelled'&&st!=='delivered'?`<button class="cancel" data-st="cancelled" data-oid="${esc(o.id)}">إلغاء الطلب</button>`:st==='cancelled'?`<button class="cancel" data-st="pending" data-oid="${esc(o.id)}">إعادة فتح الطلب</button>`:''}
    </div></div>`;
}
V.account=()=>{const c=S.customer;return `<div class="hd"><h1>حسابي</h1>${viewToggle()}</div><div class="body">
  ${c&&c.phone?`<div class="card"><div class="driver"><span class="av">${ICON.user}</span><div><b>${esc(c.name||'')}</b><small style="direction:ltr;unicode-bidi:isolate">${esc(c.phone)}</small></div><button class="link" data-logout style="color:var(--red)">خروج</button></div><div class="pin" style="border:0;padding:4px 0 0"><span class="ic">${ICON.pin}</span><div><b>${c.address?esc(c.address.area+(c.address.street?'، '+c.address.street:'')):'لم يُحدَّد عنوان'}</b><small>${c.address&&c.address.lat?'📍 موقع محدّد على خرائط Google':(c.address&&c.address.landmark?esc('قرب '+c.address.landmark):'إربد')}</small></div><button class="link" data-go="address">تعديل</button></div></div>`
  :`<div class="card"><div class="t">سجّل دخولك لحفظ عنوانك ومتابعة طلباتك</div><button class="cta" data-go="welcome" style="justify-content:center">تسجيل الدخول</button></div>`}
  <div class="sec"><div class="sec-h"><h2>طلباتي</h2><button class="link" data-refresh-mine>تحديث</button></div><div class="${S.view==='grid'?'grid2 ocard-grid':'list'}" id="myOrders">${S.myLoading?`<div class="empty">جارٍ التحميل…</div>`:S.myOrders.length?S.myOrders.map(o=>orderCard(o,false)).join(''):`<div class="empty"><h3>لا توجد طلبات بعد</h3>${S.myErr?esc(S.myErr):'طلباتك من هذا الجهاز تظهر هنا.'}</div>`}</div>
  <form id="lookupForm" style="display:flex;gap:8px"><input id="lookupIn" placeholder="متابعة طلب آخر برقمه (ON-…)" style="flex:1;border:1.5px solid var(--hair);border-radius:12px;padding:10px 12px;background:#FFF;min-width:0"><button class="chip" type="submit">متابعة</button></form></div>
  <div class="card"><div class="t">للمتجر</div><button class="pin" data-go="staff" style="border:0;padding:4px 0"><span class="ic">${ICON.grid}</span><div><b>لوحة الطلبات</b><small>استقبال الطلبات وتغيير حالتها وتعيين المندوب</small></div><span style="color:var(--muted)">${ICON.fwd}</span></button><button class="pin" data-reload style="border:0;padding:4px 0"><span class="ic">${ICON.refresh}</span><div><b>تحديث المنتجات والأسعار</b><small>${S.ready?'آخر تحميل: '+fmtDate((ls.get('smo_catalog7',{})||{}).ts||Date.now()):'غير محمّلة'}</small></div><span style="color:var(--muted)">${ICON.fwd}</span></button></div>
  <p class="hint" style="text-align:center">3045 · إربد · مفتوح 24 ساعة</p></div>`+navHTML('account')};
async function loadMine(extra){const nos=[...new Set([...(extra?[extra]:[]),...S.mine])];if(!nos.length){S.myOrders=[];render();return}
  S.myLoading=true;S.myErr='';render();
  try{const rows=await rpc('my_orders',{nos});S.myOrders=Array.isArray(rows)?rows:[];
    if(extra){if(S.myOrders.some(o=>o.order_no===extra)){if(!S.mine.includes(extra)){S.mine.unshift(extra);ls.set('smo_orders',S.mine)}}else toast('لم يُعثر على الطلب')}}
  catch(e){S.myErr=errText(e)}finally{S.myLoading=false;if(S.screen==='account')render()}}

/* staff */
V.staff=()=>{const all=S.staffOrders;const today=new Date().toDateString();const tr=all.filter(o=>new Date(o.created_at).toDateString()===today&&o.status!=='cancelled');
  const list=all.filter(o=>S.stFilter==='all'||(S.stFilter==='active'?!['delivered','cancelled'].includes(o.status):o.status===S.stFilter));
  return head('لوحة الطلبات','الطلبات الواردة عبر التطبيق',viewToggle()+`<button class="icon-btn" data-refresh-staff aria-label="تحديث">${ICON.refresh}</button>`)+`<div class="body">
  <div class="kpis"><div class="kpi"><b>${all.filter(o=>o.status==='pending').length}</b><span>بانتظار التأكيد</span></div><div class="kpi"><b>${all.filter(o=>['confirmed','preparing','out_for_delivery'].includes(o.status)).length}</b><span>قيد التنفيذ</span></div><div class="kpi"><b>${fmt(tr.reduce((a,o)=>a+Number(o.total||0),0))}</b><span>مبيعات اليوم بالدينار · ${tr.length} طلب</span></div></div>
  <div class="chips">${[['active','النشطة'],['all','الكل'],['delivered','المسلّمة'],['cancelled','الملغاة']].map(([v,l])=>`<button class="chip" data-stf="${v}" aria-pressed="${S.stFilter===v}">${l}</button>`).join('')}</div>
  <div class="${S.view==='grid'?'list ocard-grid':'list'}">${S.stLoading?`<div class="empty">جارٍ التحميل…</div>`:S.stErr?`<div class="alert red">${ICON.info}<span>${esc(S.stErr)}</span></div>`:list.length?list.map(o=>orderCard(o,true)).join(''):`<div class="empty"><h3>لا توجد طلبات هنا</h3>الطلبات الجديدة من التطبيق تظهر في هذه اللوحة.</div>`}</div></div>`+navHTML('account')};
async function loadStaff(){S.stLoading=true;S.stErr='';render();
  try{const rows=await staffRpc('staff_orders');S.staffOrders=Array.isArray(rows)?rows:[]}
  catch(e){S.stErr=errText(e)}finally{S.stLoading=false;if(S.screen==='staff')render()}}
async function setStatus(id,st){if(S.busy)return;S.busy=true;try{await staffRpc('set_status',{id,status:st});const o=S.staffOrders.find(x=>x.id===id);if(o){o.status=st;o.updated_at=new Date().toISOString()}render();toast('تم التحديث: '+(STATUS[st]||st))}catch(e){toast(errText(e))}finally{S.busy=false}}
async function setDriver(id){const el=$('#drv-'+CSS.escape(id));const val=el?el.value.trim():'';if(S.busy)return;S.busy=true;try{await staffRpc('set_driver',{id,driver:val});const o=S.staffOrders.find(x=>x.id===id);if(o)o.assigned_driver=val||null;render();toast('تم حفظ المندوب')}catch(e){toast(errText(e))}finally{S.busy=false}}

/* ---------- render ---------- */
function render(){
  const ph=$('#phone');let el=$('#screen');
  if(!el){el=document.createElement('div');el.className='screen';el.id='screen';ph.insertBefore(el,$('#toast'))}
  const active=document.activeElement;const keep=active&&ph.contains(active)&&active.id?{id:active.id,s:active.selectionStart,e:active.selectionEnd}:null;
  const scroll=$('.body',el)?$('.body',el).scrollTop:0;
  el.innerHTML=(V[S.screen]||V.home)();
  const b=$('.body',el);if(b&&S._keepScroll)b.scrollTop=scroll;S._keepScroll=false;
  queueImages();
  if(S.screen==='address')mountPicker();else S.pickMap=null;
  if(keep){const n=$('#'+CSS.escape(keep.id));if(n){n.focus({preventScroll:true});try{if(keep.s!=null)n.setSelectionRange(keep.s,keep.e)}catch{}}}
}
const rerender=()=>{S._keepScroll=true;render()};
window.__dbg={S,render,go};

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.go!==undefined){if(d.go==='cart'||d.go==='home'||d.go==='cats'||d.go==='chef'||d.go==='account'){S.stack=[];go(d.go,{},true)}else go(d.go);return}
  if(d.back!==undefined)return back();
  if(d.view){S.view=d.view;ls.set('smo_view',S.view);rerender();return}
  if(d.skip!==undefined){S.skipped=true;ls.set('smo_skipped',true);S.stack=[];go('home',{},true);return}
  if(d.inc!==undefined){S._keepScroll=true;return setQty(d.inc,(S.cart[d.inc]||0)+1)}
  if(d.dec!==undefined){S._keepScroll=true;return setQty(d.dec,(S.cart[d.dec]||0)-1)}
  if(d.cat!==undefined){S.catParent=d.cat?Number(d.cat):null;S.catSub=null;S.q='';S.shown=60;go('category');return}
  if(d.sub!==undefined){S.catParent=d.parent?Number(d.parent):null;S.catSub=d.sub?Number(d.sub):null;S.shown=60;if(S.screen!=='category'){S.q='';go('category')}else rerender();return}
  if(d.more!==undefined){S.shown+=60;rerender();return}
  if(d.retry!==undefined)return loadCatalog(true);
  if(d.reload!==undefined){toast('جارٍ تحديث المنتجات…');return loadCatalog(true)}
  if(d.del){S.delivery=d.del;rerender();return}
  if(d.clear!==undefined){S.cart={};S.cartMeta={};ls.set('smo_cart',{});ls.set('smo_cartmeta',{});render();return}
  if(b.id==='placeOrder')return placeOrder();
  if(d.chefQ){return chefAsk(d.chefQ)}
  if(d.alt!==undefined){const i=Number(d.alt);const n=(S.chef.result.items[i].cands||[]).length;S.chef.pick[i]=((S.chef.pick[i]||0)+1)%n;rerender();return}
  if(d.cq!==undefined){const i=Number(d.cq);const it=S.chef.result.items[i];const p=(it.cands||[])[S.chef.pick[i]||0];const max=p?p.stock:1;S.chef.qty[i]=Math.max(1,Math.min(max,(S.chef.qty[i]||1)+Number(d.d)));S.chef.manual[i]=true;rerender();return}
  if(d.serv){S.chef.servings=Math.max(1,Math.min(30,S.chef.servings+Number(d.serv)));applyServings();rerender();return}
  if(d.chefAdd!==undefined){const r=S.chef.result;let n=0;r.items.forEach((it,i)=>{const p=(it.cands||[])[S.chef.pick[i]||0];if(p&&!S.chef.off[i]){const q=Math.max(1,Math.min(S.chef.qty[i]||1,p.stock));S.cart[p.id]=Math.min(p.stock,(S.cart[p.id]||0)+q);if(!S.cartMeta[p.id])S.cartMeta[p.id]={dish:r.dish};n++}});ls.set('smo_cart',S.cart);ls.set('smo_cartmeta',S.cartMeta);toast(`أُضيف ${n} أصناف للسلة`);S.stack=[];go('cart',{},true);return}
  if(d.chefReset!==undefined){S.chef={msgs:[],result:null,servings:4,baseServings:4,off:{},pick:{},qty:{},manual:{}};render();return}
  if(d.geo!==undefined){useMyLocation();return}
  if(d.track){go('track',{order_no:d.track});return}
  if(d.refreshTrack!==undefined)return refreshTrack(false);
  if(d.refreshMine!==undefined)return loadMine();
  if(d.refreshStaff!==undefined)return loadStaff();
  if(d.stf){S.stFilter=d.stf;rerender();return}
  if(d.st&&d.oid)return setStatus(d.oid,d.st);
  if(d.drv)return setDriver(d.drv);
  if(d.logout!==undefined){S.customer=null;ls.set('smo_customer',null);render();return}
  if(d.copy){try{await navigator.clipboard.writeText(d.copy);toast('نُسخ الرقم')}catch{toast(d.copy)}return}
  if(b.id==='signupBtn'){const n=$('#nameIn').value.trim();if(n.length<2){$('#authErr').innerHTML=`<div class="alert red">${ICON.info}<span>اكتب اسمك.</span></div>`;return}S.customer={...(S.customer||{}),name:n,phone:S.pendingPhone||(S.customer||{}).phone};ls.set('smo_customer',S.customer);go('address',{},true);return}
  if(b.id==='addrBtn'){const area=$('#areaIn').value.trim(),street=$('#streetIn').value.trim(),landmark=$('#landIn').value.trim(),gm=$('#gmapIn').value.trim();if(!area||street.length<4){$('#authErr').innerHTML=`<div class="alert red">${ICON.info}<span>اكتب الحي والشارع/البناية حتى يصل المندوب.</span></div>`;return}
    let ll=S.pickLL||null;if(gm){ll=parseLatLng(gm)||ll;if(!ll){if(/goo\.gl|maps\.app/.test(gm)){$('#authErr').innerHTML=`<div class="alert red">${ICON.info}<span>الرابط المختصر لا يحمل الإحداثيات. افتحه في المتصفح ثم انسخ الرابط الكامل من شريط العنوان (يحتوي على @32.5…,35.8…)، أو الصق الإحداثيات مباشرة.</span></div>`}else{$('#authErr').innerHTML=`<div class="alert red">${ICON.info}<span>لم أتعرّف على الموقع. الصق رابط خرائط Google الكامل أو إحداثيات مثل 32.55, 35.85.</span></div>`}return}
      const km=kmBetween(ll,STORE_LL());if(km>12){$('#authErr').innerHTML=`<div class="alert red">${ICON.info}<span>هذا الموقع يبعد ${km.toFixed(0)} كم عن المتجر، خارج نطاق التوصيل. تأكد من الرابط.</span></div>`;return}}
    S.customer={...(S.customer||{}),address:{area,street,landmark,lat:ll?ll.lat:undefined,lng:ll?ll.lng:undefined}};S.pickLL=null;ls.set('smo_customer',S.customer);toast('تم حفظ العنوان');const next=S.afterAuth||'home';S.afterAuth=null;S.stack=[];go(next,{},true);return}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.id==='welcomeForm'){let v=$('#phoneIn').value.replace(/\D/g,'');if(v.startsWith('962'))v=v.slice(3);if(v.startsWith('0'))v=v.slice(1);if(!/^7\d{8}$/.test(v)){$('#authErr').innerHTML=`<div class="alert red">${ICON.info}<span>أدخل رقماً أردنياً صحيحاً مثل 79 123 4567</span></div>`;return}S.pendingPhone='0'+v;const c=S.customer||{};S.customer={...c,phone:S.pendingPhone};ls.set('smo_customer',S.customer);if(S.customer.name&&S.customer.address){S.stack=[];go(S.afterAuth||'home',{},true);S.afterAuth=null}else go('signup',{},true)}
  else if(f.id==='otpForm'){const code=[0,1,2,3].map(i=>$('#otp'+i).value).join('');if(code!=='3045'){$('#authErr').innerHTML=`<div class="alert red">${ICON.info}<span>الرمز غير صحيح. في النسخة التجريبية الرمز 3045.</span></div>`;return}
    const c=S.customer||{};S.customer={...c,phone:S.pendingPhone};ls.set('smo_customer',S.customer);if(S.customer.name&&S.customer.address){S.stack=[];go(S.afterAuth||'home',{},true);S.afterAuth=null}else go('signup',{},true)}
  else if(f.id==='chefForm'){const v=$('#chefIn').value.trim();if(v){$('#chefIn').value='';chefAsk(v)}}
  else if(f.id==='lookupForm'){const v=$('#lookupIn').value.trim().toUpperCase();if(v)loadMine(v)}
  else if(f.id==='addrForm'){$('#addrBtn').click()}else if(f.id==='signupForm'){$('#signupBtn').click()}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='homeQ'){const v=t.value;if(v.trim().length>=2){S.q=v;S.catParent=null;S.catSub=null;S.shown=60;go('category');setTimeout(()=>{const i=$('#catQ');if(i){i.focus();i.setSelectionRange(v.length,v.length)}},0)}}
  else if(t.id==='catQ'){S.q=t.value;S.shown=60;rerender()}
  else if(t.id==='schedIn'){S.schedule=t.value}
  else if(t.id==='gmapIn'){const ll=parseLatLng(t.value);if(ll){const v=t.value;setPick(ll);t.value=v}}
  else if(t.id==='notesIn'){S.notes=t.value}
  else if(/^otp\d$/.test(t.id)){t.value=t.value.replace(/\D/g,'').slice(-1);const i=Number(t.id.slice(3));if(t.value&&i<3)$('#otp'+(i+1)).focus();if(i===3&&t.value){const all=[0,1,2,3].every(k=>$('#otp'+k).value);if(all)$('#otpForm').requestSubmit()}}
});
document.addEventListener('change',e=>{const t=e.target;if(t.name==='pay'){S.pay=t.value}else if(t.dataset.ing!==undefined){S.chef.off[t.dataset.ing]=!t.checked;rerender()}});
document.addEventListener('keydown',e=>{if(e.key==='Backspace'&&/^otp\d$/.test(e.target.id)&&!e.target.value){const i=Number(e.target.id.slice(3));if(i>0)$('#otp'+(i-1)).focus()}});

/* ---------- boot ---------- */
S.view=ls.get('smo_view','grid');S.cart=ls.get('smo_cart',{});S.cartMeta=ls.get('smo_cartmeta',{});S.mine=ls.get('smo_orders',[]);S.customer=ls.get('smo_customer',null);S.skipped=ls.get('smo_skipped',false);
const h=(location.hash||'').replace('#','');
if(['home','cats','chef','cart','account','staff'].includes(h))S.screen=h;else S.screen=(S.customer&&S.customer.phone)||S.skipped?'home':'welcome';
render();
(async()=>{
  S.mcp=true;S.sample=true;S.booted=true;
  loadLocalImages();
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch{}}
  await loadCatalog(false);
  if(S.screen==='account')loadMine();if(S.screen==='staff')loadStaff();
})();
})();
</script>
</body>
</html>
