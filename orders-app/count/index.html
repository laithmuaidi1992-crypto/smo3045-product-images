<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002068">
<meta name="robots" content="noindex">
<title>جرد الرف — 3045</title>
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one column of product cards on white; sticky navy header with progress; each card leaves after it is counted */
:root{
  --navy:#002068; --navy-2:#1a3a86; --red:#C80828; --bg:#ffffff; --line:#e3e7f0; --soft:#f4f6fb; --ink:#0d1530; --mute:#5d6683; --ok:#0f7a43;
  --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:grid;gap:10px;padding-block:12px 14px}
.hrow{display:flex;align-items:center;gap:10px}
.hrow img{width:34px;height:34px;border-radius:8px;background:#fff}
.hrow b{font-size:17px}
.hrow small{display:block;opacity:.8;font-size:12px}
.hrow .sp{flex:1;min-width:0}
.ghost{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:13px;opacity:.9;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px}
.filters select{flex:1;min-width:0;border:0;border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink)}

/* cards */
main .wrap{display:grid;gap:12px;padding-block:14px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:96px 1fr;gap:12px;transition:transform .35s ease,opacity .35s ease,max-height .35s ease,margin .35s,padding .35s;max-height:420px;overflow:hidden}
.card.gone{transform:translateX(-110%);opacity:0;max-height:0;padding-block:0;margin-top:-12px;border-width:0}
.ph{width:96px;height:96px;border-radius:12px;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain}
.ph span{font-size:12px;color:var(--mute);text-align:center;padding:6px}
.info{min-width:0;display:grid;gap:4px;align-content:start}
.name{font-weight:700;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.sub{font-size:12px;color:var(--mute);overflow-wrap:anywhere;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.tag{justify-self:start;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--navy)}
.tag.p1{background:#fde8ec;color:var(--red)}
.entry{grid-column:1/-1;display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.step{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-size:26px;color:var(--navy);cursor:pointer}
.qty{height:52px;width:100%;border-radius:12px;border:2px solid var(--line);text-align:center;font-size:24px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.qty:focus{outline:none;border-color:var(--navy)}
.acts{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr;gap:8px}
.btn{height:48px;border-radius:12px;border:0;font-weight:700;font-size:16px;cursor:pointer}
.btn.zero{background:#fff;border:1px solid var(--red);color:var(--red)}
.btn.save{background:var(--navy);color:#fff}
.btn.save:disabled{opacity:.4}
button:focus-visible,select:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px}

.empty{text-align:center;color:var(--mute);padding:40px 10px;display:grid;gap:8px}
.empty b{color:var(--navy);font-size:20px}
.more{justify-self:center;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:10px 18px;color:var(--navy);cursor:pointer}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.box{width:100%;max-width:360px;display:grid;gap:12px;text-align:center}
.box img{width:96px;height:96px;margin:0 auto;border-radius:20px}
.box h1{margin:0;color:var(--navy);font-size:24px}
.box p{margin:0;color:var(--mute);font-size:14px}
.box input{height:52px;border-radius:12px;border:2px solid var(--line);padding:0 14px;font-size:18px;text-align:center}
.box input:focus{outline:none;border-color:var(--navy)}
.err{color:var(--red);font-size:14px;min-height:20px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);transition:transform .3s;z-index:20;font-size:14px}
.toast.show{transform:translate(-50%,0)}
.toast.err{background:var(--red)}
.toast button{background:#fff;color:var(--ink);border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" hidden>تراجع</button></div>
<script>
(()=>{
const SB_URL='https://oxrqkgbbccstbetxpnsn.supabase.co', SB_KEY='sb_publishable_ZZTqt5iEvQBsDIomZCIVQw_bvcaJ5_g';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const PAGE=30;
const S={pin:ls.get('cnt_pin',''),name:ls.get('cnt_name',''),items:[],doneToday:0,total:0,cat:ls.get('cnt_cat',''),shown:PAGE,loaded:false,mine:0};

async function call(action,args){
  const r=await fetch(SB_URL+'/rest/v1/rpc/shelf_count_app',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},body:JSON.stringify({action,args:{...(args||{}),pin:S.pin,name:S.name}})});
  let j=null;try{j=await r.json()}catch{}
  if(!r.ok){const m=(j&&(j.message||j.hint))||('HTTP '+r.status);if(/bad_pin/.test(m)){logout();throw new Error('الرمز غير صحيح — أدخله مجدداً')}throw new Error(m==='bad_qty'?'أدخل رقماً صحيحاً':m)}
  return j;
}

let tT=null,undoFn=null;
function toast(msg,{err=false,undo=null}={}){const t=$('#toast');$('#toastMsg').textContent=msg;t.classList.toggle('err',err);undoFn=undo;$('#toastUndo').hidden=!undo;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>{t.classList.remove('show');undoFn=null},undo?6000:2600)}
$('#toastUndo').addEventListener('click',()=>{const f=undoFn;undoFn=null;$('#toast').classList.remove('show');f&&f()});

function logout(){S.pin='';ls.set('cnt_pin','');render()}

async function load(){
  try{const d=await call('list');S.items=d.items||[];S.doneToday=d.done_today||0;S.total=d.total||0;S.loaded=true;render()}
  catch(e){toast(e.message,{err:true})}
}

function cats(){const m=new Map();S.items.forEach(i=>{const k=i.category||'بدون قسم';m.set(k,(m.get(k)||0)+1)});return [...m.entries()].sort((a,b)=>b[1]-a[1])}
function visible(){return S.items.filter(i=>!S.cat||(i.category||'بدون قسم')===S.cat)}

function V_login(){return `<div class="login"><div class="box">
  <img src="../icon-512.png" alt="3045">
  <h1>جرد الرف</h1>
  <p>اكتب الكمية الموجودة فعلاً على الرف لكل منتج. يُحدَّث المخزون مباشرة.</p>
  <input id="nameIn" placeholder="اسمك" autocomplete="name" value="${esc(S.name)}">
  <input id="pinIn" inputmode="numeric" placeholder="رمز الكاشير" autocomplete="one-time-code">
  <div class="err" id="pinErr"></div>
  <button class="btn save" id="pinBtn">ابدأ الجرد</button>
</div></div>`}

function card(i){
  const img=i.img?`<img src="${esc(i.img)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<span>لا توجد صورة</span>'">`:`<span>لا توجد صورة</span>`;
  return `<article class="card" data-id="${esc(i.id)}">
    <div class="ph">${img}</div>
    <div class="info">
      <div class="name">${esc(i.name)}</div>
      ${i.name_en&&i.name_en!==i.name?`<div class="sub">${esc(i.name_en)}</div>`:''}
      <div class="sub">${esc(i.barcode||'')}${i.category?' · '+esc(i.category):''}</div>
      <span class="tag ${i.priority===1?'p1':''}">${esc(i.reason||'')}</span>
    </div>
    <div class="entry">
      <button class="step" data-step="1" aria-label="زيادة">+</button>
      <input class="qty" type="number" inputmode="numeric" min="0" max="5000" placeholder="العدد" aria-label="الكمية على الرف" id="q_${esc(i.id)}">
      <button class="step" data-step="-1" aria-label="إنقاص">−</button>
    </div>
    <div class="acts">
      <button class="btn zero" data-zero>غير موجود</button>
      <button class="btn save" data-save disabled>حفظ الكمية</button>
    </div>
  </article>`}

function render(){
  const app=$('#app');
  if(!S.pin){app.innerHTML=V_login();return}
  const list=visible(), shown=list.slice(0,S.shown);
  const done=S.total-S.items.length, pct=S.total?Math.round(done/S.total*100):0;
  const cs=cats();
  app.innerHTML=`<header><div class="wrap">
    <div class="hrow"><img src="../icon-192.png" alt=""><div class="sp"><b>جرد الرف</b><small>${esc(S.name||'')} · جردتَ ${S.mine} الآن · اليوم ${S.doneToday}</small></div><button class="ghost" id="out">خروج</button></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="meta"><span>تم ${done} من ${S.total}</span><span>متبقٍ ${S.items.length}</span></div>
    <div class="filters"><select id="cat" aria-label="القسم"><option value="">كل الأقسام (${S.items.length})</option>${cs.map(([k,n])=>`<option value="${esc(k)}" ${S.cat===k?'selected':''}>${esc(k)} (${n})</option>`).join('')}</select></div>
  </div></header>
  <main><div class="wrap" id="list">
    ${!S.loaded?`<div class="empty"><b>جارٍ تحميل المنتجات…</b></div>`:
      shown.length?shown.map(card).join('')+(list.length>shown.length?`<button class="more" id="more">عرض المزيد (${list.length-shown.length})</button>`:''):
      `<div class="empty"><b>انتهى الجرد ${S.cat?'في هذا القسم':''} 👏</b><span>${S.cat?'اختر قسماً آخر من القائمة.':'شكراً، كل المنتجات في القائمة جُردت.'}</span></div>`}
  </div></main>`;
}

function updateHead(){
  const done=S.total-S.items.length, pct=S.total?Math.round(done/S.total*100):0;
  const bar=$('header .bar i');if(bar)bar.style.width=pct+'%';
  const m=$('header .meta');if(m)m.innerHTML=`<span>تم ${done} من ${S.total}</span><span>متبقٍ ${S.items.length}</span>`;
  const sm=$('header .hrow small');if(sm)sm.textContent=`${S.name||''} · جردتَ ${S.mine} الآن · اليوم ${S.doneToday}`;
}

async function save(cardEl,qty){
  const id=cardEl.dataset.id, item=S.items.find(i=>i.id===id);
  cardEl.querySelectorAll('button').forEach(b=>b.disabled=true);
  try{
    const r=await call('submit',{id,qty});
    cardEl.classList.add('gone');
    S.items=S.items.filter(i=>i.id!==id);S.mine++;S.doneToday++;
    const diff=qty-Number(r.before||0);
    toast(diff===0?`✓ ${item.name}: مطابق (${qty})`:`✓ ${item.name}: ${qty} (كان ${r.before})`,{undo:async()=>{
      try{await call('undo',{id});S.items.unshift(item);S.mine=Math.max(0,S.mine-1);S.doneToday=Math.max(0,S.doneToday-1);render();toast('أُعيد المنتج للقائمة')}catch(e){toast(e.message,{err:true})}
    }});
    setTimeout(()=>{cardEl.remove();if(!document.querySelector('.card'))render();else updateHead()},380);
  }catch(e){toast(e.message,{err:true});cardEl.querySelectorAll('button').forEach(b=>b.disabled=false)}
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='pinBtn'){
    const name=$('#nameIn').value.trim(), pin=$('#pinIn').value.trim(), er=$('#pinErr');
    if(!name){er.textContent='اكتب اسمك أولاً';return}
    if(!pin){er.textContent='اكتب الرمز';return}
    try{S.pin=pin;S.name=name;const r=await call('auth');if(r&&r.role){ls.set('cnt_pin',pin);ls.set('cnt_name',name);render();load()}else{S.pin='';er.textContent='الرمز غير صحيح'}}
    catch{S.pin='';er.textContent='تعذّر الاتصال — تحقّق من الإنترنت'}
    return}
  if(b.id==='out'){logout();return}
  if(b.id==='more'){S.shown+=PAGE;render();return}
  const c=b.closest('.card');if(!c)return;
  const inp=c.querySelector('.qty'), sv=c.querySelector('[data-save]');
  if(b.dataset.step){const v=Math.max(0,(parseInt(inp.value,10)||0)+Number(b.dataset.step));inp.value=v;sv.disabled=false;return}
  if(b.hasAttribute('data-zero')){save(c,0);return}
  if(b.hasAttribute('data-save')){const v=parseInt(inp.value,10);if(isNaN(v)||v<0){toast('أدخل الكمية',{err:true});return}save(c,v)}
});
document.addEventListener('input',e=>{if(e.target.classList.contains('qty')){const c=e.target.closest('.card');c.querySelector('[data-save]').disabled=e.target.value===''}});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='pinIn'||e.target.id==='nameIn'){$('#pinBtn').click();return}
  if(e.target.classList.contains('qty')){const s=e.target.closest('.card').querySelector('[data-save]');if(!s.disabled)s.click()}
});
document.addEventListener('change',e=>{if(e.target.id==='cat'){S.cat=e.target.value;S.shown=PAGE;ls.set('cnt_cat',S.cat);render();window.scrollTo(0,0)}});

render();
if(S.pin)load();
})();
</script>
</body>
</html>
